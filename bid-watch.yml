name: Weekly NJ Bid Watch

on:
  schedule:
    # Mondays 11:00 UTC = 7:00 AM Eastern (EDT) / 6:00 AM (EST)
    - cron: "0 11 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "normal = scan + email, baseline = record only, dry-run = print only"
        type: choice
        options: [normal, baseline, dry-run]
        default: normal

permissions:
  contents: write   # lets the job save seen_bids.db back to the repo

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan and email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MODE: ${{ inputs.mode }}
        run: |
          FLAG=""
          [ "$MODE" = "baseline" ] && FLAG="--baseline"
          [ "$MODE" = "dry-run" ] && FLAG="--dry-run"
          python bid_watch.py $FLAG

      - name: Save seen-bids database
        run: |
          git config user.name "bid-watcher"
          git config user.email "bid-watcher@users.noreply.github.com"
          git add seen_bids.db
          git diff --cached --quiet || (git commit -m "Update seen bids" && git push)
